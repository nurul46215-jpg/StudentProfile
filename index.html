<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pudin Dashboard - Aesthetic Pink</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="main-header">
        <div class="logo">🌸 LOGO</div>
        <div class="greeting">Hi, Ayin ✨</div>
    </header>

    <main class="dashboard-container">
        
        <section class="card">
            <div class="image-stack">
                    <img src="images/ayin.jpg" alt="Gambar ayin" class="photo photo-front" style="object-fit: cover;">
                    <img src="images/ayin.jpg" alt="Gambar belakang" class="photo photo-back" style="object-fit: cover;">
                </div>
            </div>
        </section>

        <section class="card">
            <h2>BIODATA</h2>
            <div class="bio-item">
                <span class="icon">✨</span>
                <span class="text">Nurul Ain binti Mohd Akhir</span>
            </div>
            <div class="bio-item">
                <span class="icon">📞</span>
                <span class="text">019-3766310</span>
            </div>
            <div class="bio-item">
                <span class="icon">🎀</span>
                <span class="text">Lorong Nawa 17,Bandar Utama, Sungai Petani,Kedah</span>
            </div>
        </section>

        <section class="card">
            <h2>NOTA</h2>
            <ul class="nota-list">
                <li><a href="http://spmp.ptss.edu.my/" target="_blank" class="special-link">SPMP Portal</a></li>
                <li><a href="https://ptsslms.cidos.edu.my/" target="_blank" class="special-link">CIDOS Portal</a></li>
            </ul>
        </section>
        
    </main>

</body>
</html>
